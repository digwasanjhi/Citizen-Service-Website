<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - SevaConnect</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/register.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <div class="logo-icon">🏛️</div>

        <div>
            <h2>SevaConnect</h2>
            <span>Citizen Service Platform</span>
        </div>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="track.html">Track Application</a>
        <a href="myapplication.html">My Applications</a>
    </nav>

</header>
<main class="register-page">

    <div class="register-card">

        <div class="register-heading">
            <span class="section-label">CITIZEN ACCOUNT</span>

            <h1>Create Account</h1>

            <p>
                Register to access citizen services easily.
            </p>
        </div>


        <form id="registerForm">

            <label>Full Name</label>

            <input
                type="text"
                id="registerName"
                placeholder="Enter your full name"
                required
            >


            <label>Mobile Number</label>

            <input
                type="tel"
                id="registerMobile"
                placeholder="Enter 10-digit mobile number"
                maxlength="10"
                required
            >


            <label>Email Address</label>

            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Create a password"
                required
            >


            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
            >


            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <label for="terms">
                    I agree to the terms and conditions.
                </label>

            </div>


            <button type="submit" class="register-btn">
                Create Account
            </button>


            <p class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </form>

    </div>

</main>


<footer>

    <div class="footer-bottom">

        <p>
            © 2026 SevaConnect. Citizen Service Delivery Platform.
        </p>

        <p>
            Designed for a better digital India.
        </p>

    </div>

</footer>


<script src="js/register.js"></script>

</body>
</html>
